<!DOCTYPE html>
<html>
  <head>

    <!-- meta for the browser to allow for mobile first -->
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />

    <title>Data Collector for AGOL</title>

    <!-- importing css and libraries for esri.js -- I moved these above my custom style so the arcgis style does not overwrite my own styles -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.26/"></script>

    <!-- define custom css style -->
    <style>
        html,
        body { /* adding mobile-first css viewport rules to the parent container (I think that's the body in this case?) */
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }

        /* adding css for survey button */

        .addRecordBtn {
            position: absolute;
            z-index: 10;
            top: 10px;
            right: 10px;
            background-color: #0079c1;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .addRecordBtn:hover {
            background-color: #005a87;
        }

    </style>

  </head>
  <body>

    <!-- add the survey button -->
     <a href="https://arcg.is/1Kr9HG5" target="_blank" class="addRecordBtn">Add Record</a>

    <!-- call the div 'viewDiv' -->
     <div id="viewDiv"></div>

    <!-- loading the modules - same as labs 2 and 3, I moved the script to the body to make sure viewDiv is already found/rendered before the script calls it -->
     <script>
        require([
            "esri/config", 
            "esri/Map", 
            "esri/views/MapView", 
            "esri/widgets/Locate",
            "esri/widgets/Search",
            "esri/layers/FeatureLayer",
            "esri/widgets/Expand"
        ], (esriConfig, Map, MapView, Locate, Search, FeatureLayer, Expand) => {
           
            // add API key (I am using the key set up in previous labs)
            esriConfig.apiKey = "AAPTaZ2rQpZ3e_kAjLMbAoRHR0g.._fqqp4bDNHHZdzTSsp9AO-QkJHtKqpaj-7Xv25F1YGAftgihPfF0YtKx3TlgjV1fIfgz5d5KD1tO1WludBUUE8UK14qZyasG6wdcyVgej-0RvTJlT6Cqr8NSnHJs2CR-QKtZ6cx1a-DlDQQytvHfcbHYyH2--XMqzLkkWez9t3HIMhqczJVoVTeXmERX-Sc_6OCF9zTuUnAuesDvugrzl5GUAN3LGTz2Zteo1pZkcrVPu2RRO94cFDhn8pvWIVGFeUSd7-icAT1_FDhHahp4";
       
            // define the basemap
            const map = new Map({
                basemap: "satellite"
            });

            // Challenge 1: Use Center and Zoom to load with inital extent of choice
            const view = new MapView({
                container: "viewDiv", // Reference to the DOM node that will contain the view
                map: map, // References the map object
                center: [-122.3328, 47.6061], // lon lat for Seattle, WA
                zoom: 11
            });

            // define locate widget
            const locateBtn = new Locate({
                view: view,
                geolocationOptions: { // setting up timing failsafe
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            });

            // Handle location errors gracefully per the rubric (Gemini helped with the function outline)
            locateBtn.on("locate-error", (event) => {
                console.error("Locate Widget Error:", event.error);
                
                // Provide an alert message
                alert("Unable to find your location. Please check your phone's privacy settings or ensure your GPS signal is strong.");
            });

            // Add the locate widget to the top left corner of the view, below search and zoom widgets
            view.ui.add(locateBtn, {
                position: "top-left",
                index: 2
            });

             // Challenge 2: add address search bar 
            // create search widget
            const searchWidget = new Search({
                view: view
            });

            // because the Add Record button takes up a lot of space, I placed the search widget within an expand widget
            const searchExpand = new Expand({
                view: view,
                content: searchWidget,
                expandIcon: "search" 
            });

            // Add search widget within expand widgetin top left corner of the view, above other widgets
            view.ui.add(searchExpand, {
            position: "top-left",
            index: 0
            });

            // Create featurelayer from feature service (url from survey results)
            const layer = new FeatureLayer({ 
                // URL to the service 
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/survey123_0895af8eb5ca41d7bd0b3e720e6902bb_results/FeatureServer"
            });

            // add layer to the map
            map.add(layer);

            // final failsafe verifies layer loads correctly or fails with an alert message
            layer.load().catch((error) => {
                console.error("FeatureLayer failed to load:", error);
                alert("Notice: The survey data layer is temporarily unavailable. You can still add a record using the submission form above.");
            });

        });

    </script>

  </body>
</html>
